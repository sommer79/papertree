# In den bestehenden server-Block von paperless.example.org einfügen,
# Datei /etc/nginx/sites-enabled/paperless.example.org, VOR der location / .
#
# PaperTree muss unter derselben Domain laufen wie Paperless (A6): nur dann
# schickt der Browser den Session-Cookie mit, und es braucht weder Token noch
# CORS.

# Ohne Schrägstrich am Ende sind relative Pfade der Oberfläche falsch.
location = /papertree {
    return 301 /papertree/;
}

location /papertree/ {
    proxy_pass http://127.0.0.1:8080/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /papertree;

    # PDF-Vorschau und Download laufen als Strom durch.
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
}
